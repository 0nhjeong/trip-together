<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#FBF8F3" />
  <title>같이갈래 · 함께 짜는 여행노트</title>
  <meta name="description" content="링크 하나로 친구들과 함께 지도에 핀을 찍으며 국내 여행 계획을 짜요." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 메인 화면 -->
  <div id="app" hidden>
    <header class="topbar">
      <button class="room-title" id="roomTitleBtn" type="button" aria-label="여행 정보 수정">
        <span class="room-emoji">🧳</span>
        <span class="room-text">
          <strong id="roomTitle">여행</strong>
          <small id="roomSub"></small>
        </span>
      </button>
      <button class="chip chip-me" id="meBtn" type="button" aria-label="닉네임 변경"></button>
      <button class="icon-btn share" id="shareBtn" type="button" aria-label="링크 공유">공유</button>
    </header>

    <form class="searchbar" id="searchForm" autocomplete="off">
      <span class="search-ico" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" enterkeyhint="search" placeholder="광안리 국밥, 해운대 카페…" />
      <button type="button" class="search-clear" id="searchClear" aria-label="검색어 지우기" hidden>✕</button>
      <button type="submit" class="search-go">검색</button>
    </form>

    <div id="map" class="map"></div>
    <div class="map-hint" id="mapHint">지도를 탭하거나 꾹 눌러 직접 핀을 찍을 수 있어요</div>

    <div class="tempbar" id="tempbar" hidden></div>

    <section class="sheet" id="sheet" aria-label="여행 목록">
      <div class="sheet-grip" id="sheetGrip"><span></span></div>
      <nav class="tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="cand">후보 <em id="cntCand">0</em></button>
        <button type="button" role="tab" data-tab="plan">일차별 일정 <em id="cntPlan">0</em></button>
        <button type="button" role="tab" data-tab="search">검색 결과 <em id="cntSearch">0</em></button>
      </nav>
      <div class="sheet-tools" id="sheetTools"></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <!-- 시작(방 만들기) 화면 -->
  <div id="landing" class="landing" hidden></div>

  <!-- 장소 상세 / 공용 모달 -->
  <div id="detail" class="overlay" hidden></div>
  <div id="modal" class="overlay" hidden></div>

  <div id="demoBanner" class="demo-banner" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
